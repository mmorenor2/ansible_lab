---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (Centos)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "CentOS"

  - name: install updates (Ubuntu)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

- hosts: all
  become: true
  tasks:
    
  - name: create simon user
    tags: always
    user:
      name: simone
      groups: root

  - name: add ssh key for simone
    tags: always
    authorized_key:
      user: simone
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMOT7gl7lpziispTXA/FZjXFcizX70PRJIq7nGGrBkuH ansible_lab"

  - name: add sudoers file for simone
    tags: always
    copy:
      src: /home/ansible/resources/sudoer_simone
      dest: /etc/sudoers.d/simone
      owner: root
      group: root

